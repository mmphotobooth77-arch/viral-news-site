
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Article</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); color: #e2e8f0; font-family: 'Segoe UI', Arial, sans-serif; line-height: 1.8; padding: 20px; }
    .container { max-width: 900px; margin: 0 auto; background: rgba(30, 41, 59, 0.8); border-radius: 15px; overflow: hidden; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3); }
    header { background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%); padding: 40px 20px; text-align: center; border-bottom: 3px solid #3b82f6; }
    .category { display: inline-block; background: #3b82f6; color: white; padding: 8px 16px; border-radius: 20px; font-size: 12px; margin-bottom: 15px; font-weight: bold; }
    h1 { font-size: 42px; color: #fff; margin: 15px 0; text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3); }
    img { width: 100%; height: auto; display: block; margin: 0; }
    .content { padding: 40px; }
    p { font-size: 16px; color: #cbd5e1; margin-bottom: 20px; line-height: 1.9; text-align: justify; }
    footer { background: rgba(15, 23, 42, 0.5); text-align: center; padding: 20px; color: #94a3b8; font-size: 12px; border-top: 1px solid rgba(148, 163, 184, 0.1); }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="category">NEWS</div>
      <h1>Article</h1>
    </header>
    <img src="https://images.unsplash.com/photo-1554830310-5b57379d04e6?crop=entropy&cs=tinysrgb&fit=max&fm=jpg&ixid=M3w5NTI5MDV8MHwxfHJhbmRvbXx8fHx8fHx8fDE3NzkxNDY3MzB8&ixlib=rb-4.1.0&q=80&w=1080" alt="Article" onerror="this.src='https://images.unsplash.com/photo-1504711434969-e33886168f5c'">
    <div class="content">
      <p>Content</p>
    </div>
    <footer>
      <p>© 2026 - AI Viral News Auto Publisher</p>
    </footer>
  </div>
</body>
</html>
